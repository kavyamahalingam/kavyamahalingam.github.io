<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../assets/statics/home.css">
    <link rel="stylesheet" href="../assets/statics/contact.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Contact Us - Organic Store</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../assets/images/logo.svg" alt="Logo">
        </div>
        <nav id="navbar">
            <ul>
                <li><a href="../pages/home.html">Home</a></li>
                <li><a href="../pages/everything.html">Everything</a></li>
                <li><a href="../pages/grocery.html">Grocery</a></li>
                <li><a href="../pages/juice.html">Juice</a></li>
                <li><a href="../pages/contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-cart-shopping" id="cart-icon"></i>
                <span id="cart-count">0</span>
            </div>
            <button class="add_to_cart">Add to Cart</button>
            <div class="hamburger" id="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="contact-container">
        <section class="contact-hero" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('../assets/images/contact_hero.png');">
            <h1>Contact Us</h1>
        </section>

        <section class="contact-content">
            <div class="contact-details">
                <div class="info-card">
                    <i class="fa-solid fa-location-dot"></i>
                    <h3>Our Address</h3>
                    <p>123 Organic Lane, Fresh City, FC 56789</p>
                </div>
                <div class="info-card">
                    <i class="fa-solid fa-phone"></i>
                    <h3>Call Us</h3>
                    <p>+1 (234) 567-890</p>
                </div>
                <div class="info-card">
                    <i class="fa-solid fa-envelope"></i>
                    <h3>Email Us</h3>
                    <p>contact@organicstore.com</p>
                </div>
            </div>

            <div class="contact-form-container">
                <h2>Send Us a Message</h2>
                <form id="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="subject" name="subject" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">SEND MESSAGE</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Organic Store. All rights reserved.</p>
    </footer>

    <script src="../script/scripts.js"></script>
</body>

</html>
