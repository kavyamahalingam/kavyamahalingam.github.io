<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Project Card</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .project-card{
            width:350px;
            background:#1e293b;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.4);
            transition:0.3s;
        }

        .project-card:hover{
            transform:translateY(-5px);
        }

        .project-image img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .project-content{
            padding:20px;
        }

        .project-content h2{
            color:white;
            margin-bottom:10px;
            font-size:24px;
        }

        .project-content p{
            color:#cbd5e1;
            line-height:1.6;
            margin-bottom:20px;
        }

        .buttons{
            display:flex;
            gap:15px;
        }

        .btn{
            flex:1;
            text-align:center;
            padding:12px;
            border-radius:8px;
            text-decoration:none;
            font-weight:bold;
            transition:0.3s;
        }

        .live-btn{
            background:#2563eb;
            color:white;
        }

        .live-btn:hover{
            background:#1d4ed8;
        }

        .github-btn{
            background:#334155;
            color:white;
        }

        .github-btn:hover{
            background:#475569;
        }
    </style>
</head>

<body>

    <div class="project-card">

        <div class="project-image">
            <img src="https://images.unsplash.com/photo-1522204523234-8729aa6e3d5f" alt="E-Commerce Project">
        </div>

        <div class="project-content">

            <h2>E-Commerce Website</h2>

            <p>
                A modern full-stack e-commerce platform with shopping cart,
                product management, secure login, payment integration,
                and responsive UI design.
            </p>

            <div class="buttons">

                <!-- LIVE WEBSITE BUTTON -->
                <a href="https://your-ecommerce-website-link.com"
                   target="_blank"
                   class="btn live-btn">
                    Live Demo
                </a>

                <!-- GITHUB BUTTON -->
                <a href="https://github.com/yourusername/yourrepository"
                   target="_blank"
                   class="btn github-btn">
                    GitHub
                </a>

            </div>

        </div>

    </div>

</body>
</html>
